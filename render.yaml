services:
  - type: web
    name: whispr
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
